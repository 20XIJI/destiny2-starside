<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编辑台 · Starside</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d14">
<link rel="preload" href="../assets/fonts/chakra-petch-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="style.css">
<!-- 有令牌就先把登录框藏起来。**必须在 <head> 里同步跑**：admin.js 是 defer，
     等它执行完再藏，登录框已经画出来闪过一下了。认不出令牌或过期，由 admin.js
     把这个类摘掉，登录框照常出现。 -->
<script>try{if(localStorage.sa_at)document.documentElement.classList.add('signed')}catch(_){}</script>
</head>
<body>

<div class="site-head">
<nav class="site-nav">
<span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
<a class="home" href="../index.html">Starside</a>
<span class="sep">/</span>
<span aria-current="page">编辑台</span>
</nav>
<div class="toolbar" id="tabs" hidden>
<div class="tool-chips">
<button type="button" class="chip" data-view="review" aria-current="true">审核 <span id="n-doc"></span></button>
<button type="button" class="chip" data-view="builds">配装 <span id="n-sub"></span></button>
<button type="button" class="chip" data-view="hist">记录</button>
<button type="button" class="chip" data-view="eds" hidden>编辑者</button>
</div>
</div>
</div>

<header class="page-head">
<div class="head-row">
<h1 id="h1">编辑台</h1>
<p class="who" id="me" hidden><span id="me-name"></span><span class="sep">·</span><span id="me-lv"></span><button type="button" class="chip" id="out">退出</button></p>
</div>
</header>

<main>

<section class="block" id="gate">
<h2 class="sect-label">登录</h2>
<p class="lede">账号由管理员建，没有自助注册。</p>
<form id="f-pw" class="login">
<label>用户名<input class="tool-search" name="username" autocomplete="username" required></label>
<label>密码<input class="tool-search" name="password" type="password" autocomplete="current-password" required></label>
<button type="submit" class="chip">登录</button>
</form>
<p class="tip" id="gate-tip" role="status"></p>
</section>

<section class="block" id="stranger" hidden>
<h2 class="sect-label">还不是编辑者</h2>
<p class="lede">你的 ID 是 <code id="my-uid"></code>，把它发给管理员，加进白名单后刷新即可。</p>
</section>

<div id="views" hidden></div>

</main>

<script src="terms.js" defer></script>
<script src="pages.js" defer></script>
<script src="admin.js" defer></script>
</body>
</html>
