<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编辑台 · Starside</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d14">
<link rel="preload" href="../assets/fonts/chakra-petch-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="style.css">
<!-- 有令牌就先把登录页藏起来。**必须在 <head> 里同步跑**：admin.js 是 defer，
     等它执行完再藏，登录页已经画出来闪过一下了。认不出令牌或过期，由 admin.js
     把这个类摘掉，登录页照常出现。 -->
<script>try{if(localStorage.sa_at)document.documentElement.classList.add('signed')}catch(_){}</script>
</head>
<body>

<!-- 登录与未授权共用一个版面：左边一面墙，右边表单。墙上的图由 admin.js 在这一屏
     真要出现时才铺，已登录的人一张都不下载。 -->
<div class="gate" id="gate">
<div class="wall" id="wall" aria-hidden="true">
<div class="sign"><span class="mark"><i></i><i></i><i></i></span><b>STARSIDE</b><p>Destiny 2 中文资料台 · 编辑台</p></div>
</div>
<div class="gate-side">
<div class="gate-form" id="login">
<h1>登录编辑台</h1>
<p>审核配装投稿与资料页改动。</p>
<form id="f-pw">
<label class="x-field"><span>用户名</span><input class="x-in" name="username" autocomplete="username" required></label>
<label class="x-field"><span>密码</span><input class="x-in" name="password" type="password" autocomplete="current-password" required></label>
<p class="x-tip" id="gate-tip" role="status"></p>
<button type="submit" class="x-btn fill lg">登录</button>
</form>
<p class="foot">不开放注册，账号由超级管理员开通。<br><a href="../index.html">返回 Starside</a></p>
</div>
<div class="gate-form" id="stranger" hidden>
<h1>账号未获授权</h1>
<p>登录已成功，但该账号不在编辑者名单中。请将下方 UID 发送给超级管理员，加入名单后刷新本页。</p>
<div class="uid"><code id="my-uid"></code><button type="button" class="x-btn sm" id="copy-uid">复制</button></div>
<p class="x-tip" id="uid-tip" role="status"></p>
<div class="x-acts"><button type="button" class="x-btn fill" id="reload">刷新</button><button type="button" class="x-btn quiet" id="switch">切换账号</button></div>
</div>
</div>
</div>

<header class="top" id="top" hidden>
<a class="x-brand" href="../index.html"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><b>STARSIDE</b><span>编辑台</span></a>
<nav class="tabs" id="tabs">
<button type="button" class="tab" data-view="queue" aria-current="true">审核<span class="x-n hot" id="n-wait"></span></button>
<button type="button" class="tab" data-view="hist">记录</button>
<button type="button" class="tab" data-view="eds" hidden>编辑者</button>
</nav>
<div class="me"><b id="me-name"></b><span id="me-lv"></span><button type="button" class="x-btn quiet sm" id="out">退出</button></div>
</header>

<!-- 列表版面：审核、记录与编辑者三屏的正文，整块重画。 -->
<main class="list" id="views" hidden></main>

<!-- 收件箱版面：左边队列，右边详情。**详情那一格的骨架固定在这里**：填表页的 iframe
     建一次就常驻在 #stage 里，append 进重建过的容器等于重新挂载，浏览器会把整页再载
     一遍。队列、页头、#pane 与页脚清空重建；配装详情用 #stage，资料页改动与记录用 #pane。 -->
<div class="ib" id="ib" hidden>
<aside class="q" id="queue"></aside>
<section class="d" id="detail">
<header class="d-head" id="stage-head"></header>
<div class="d-body" id="stage"></div>
<div class="d-body d-col" id="pane"></div>
<div class="d-foot d-col" id="stage-foot"></div>
</section>
</div>

<!-- 词表不在这里引：lint() 全仓只有 admin/edit.js 一个调用点，编辑台自己
     这一屏从不跑闸门，而 terms.js 是 104 KB。资料页上开编辑态时由 edit.js
     按需拉，那一份现读 window.starsideTerms，与本文件的先后没有约束。 -->
<script src="pages.js" defer></script>
<script src="dialect.js" defer></script>
<script src="admin.js" defer></script>
</body>
</html>
