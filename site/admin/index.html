<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编辑台 · Starside</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d14">
<link rel="preload" href="../assets/fonts/chakra-petch-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="style.css">
<!-- 有令牌就先把登录页藏起来。**必须在 <head> 里同步跑**：admin.js 是 defer，
     等它执行完再藏，登录页已经画出来闪过一下了。认不出令牌或过期，由 admin.js
     把这个类摘掉，登录页照常出现。 -->
<script>try{if(localStorage.sa_at)document.documentElement.classList.add('signed')}catch(_){}</script>
</head>
<body>

<!-- 登录与未授权共用一张浮于星空之上的双层表壳面板：零外部图片，星空复用 assets/sky-core.js。 -->
<div class="gate" id="gate">
<canvas class="gate-sky" aria-hidden="true"></canvas>
<div class="gate-wrap">
<div class="gate-bezel">
<section class="gate-card">
<div class="gate-brand">
<span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
<b>STARSIDE</b>
<span class="gate-rule" aria-hidden="true"></span>
<span class="gate-code">ADMIN</span>
</div>
<div class="gate-body" id="login">
<div class="gate-title">
<h1>登录编辑台</h1>
<p>审核配装投稿与资料页改动</p>
</div>
<form id="f-pw">
<div class="x-field">
<label for="gate-user">用户名</label>
<input class="x-in" id="gate-user" name="username" placeholder="输入编辑者账号" autocomplete="username" spellcheck="false" autocapitalize="none" autocorrect="off" enterkeyhint="next" required>
</div>
<div class="x-field">
<label for="gate-pw">密码</label>
<div class="gate-pw-box">
<input class="x-in" id="gate-pw" name="password" type="password" placeholder="输入密码" autocomplete="current-password" enterkeyhint="done" required>
<button type="button" class="gate-eye" id="pw-toggle" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="eye-open" d="M1.5 8s2.4-4 6.5-4 6.5 4 6.5 4-2.4 4-6.5 4-6.5-4-6.5-4Z"/><circle class="eye-open" cx="8" cy="8" r="1.8"/><path class="eye-off" d="M2.2 2.2 13.8 13.8M6.4 4.3A7 7 0 0 1 8 4c4.1 0 6.5 4 6.5 4a11.3 11.3 0 0 1-2.2 2.6M9.5 11.7A7 7 0 0 1 8 12c-4.1 0-6.5-4-6.5-4a11.4 11.4 0 0 1 2.7-3"/></svg></button>
</div>
</div>
<p class="x-tip" id="gate-tip" role="status"></p>
<div class="gate-acts">
<a class="gate-back" href="../index.html">← 返回主站</a>
<button type="submit" class="gate-cta">登录</button>
</div>
</form>
</div>
<div class="gate-body" id="stranger" hidden>
<div class="gate-title">
<h1>账号未获授权</h1>
<p>登录已成功，但该账号不在编辑者名单中。请将下方 UID 发送给超级管理员，加入名单后刷新本页。</p>
</div>
<div class="uid"><code id="my-uid"></code><button type="button" class="x-btn sm" id="copy-uid">复制</button></div>
<p class="x-tip" id="uid-tip" role="status"></p>
<div class="gate-acts gate-acts-3">
<a class="gate-back" href="../index.html">← 返回主站</a>
<button type="button" class="gate-sub" id="switch">切换账号</button>
<button type="button" class="gate-cta" id="reload">刷新</button>
</div>
</div>
</section>
</div>
</div>
</div>

<header class="top" id="top" hidden>
<a class="x-brand" href="../index.html"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><b>STARSIDE</b><span>编辑台</span></a>
<nav class="tabs" id="tabs">
<button type="button" class="tab" data-view="queue" aria-current="true">审核<span class="x-n hot" id="n-wait"></span></button>
<button type="button" class="tab" data-view="hist">记录</button>
<button type="button" class="tab" data-view="eds" hidden>编辑者</button>
</nav>
<div class="me"><span class="x-tip" id="sync-tip" role="status"></span><button type="button" class="x-btn sm" id="sync-shop" hidden>同步商店</button><b id="me-name"></b><span id="me-lv"></span><button type="button" class="x-btn quiet sm" id="out">退出</button></div>
</header>

<!-- 列表版面：审核、记录与编辑者三屏的正文，整块重画。 -->
<main class="list" id="views" hidden></main>

<!-- 收件箱版面：左边队列，右边详情。**详情那一格的骨架固定在这里**：填表页的 iframe
     建一次就常驻在 #stage 里，append 进重建过的容器等于重新挂载，浏览器会把整页再载
     一遍。队列、页头、#pane 与页脚清空重建；配装详情用 #stage，资料页改动与记录用 #pane。 -->
<div class="ib" id="ib" hidden>
<aside class="q" id="queue"></aside>
<section class="d" id="detail">
<header class="d-head" id="stage-head"></header>
<div class="d-body" id="stage"></div>
<div class="d-body d-col" id="pane"></div>
<div class="d-foot d-col" id="stage-foot"></div>
</section>
</div>

<!-- 词表不在这里引：lint() 全仓只有 admin/edit.js 一个调用点，编辑台自己
     这一屏从不跑闸门，而 terms.js 是 104 KB。资料页上开编辑态时由 edit.js
     按需拉，那一份现读 window.starsideTerms，与本文件的先后没有约束。 -->
<script src="pages.js" defer></script>
<script src="dialect.js" defer></script>
<script src="../builds/source.js" defer></script>
<script src="shared.js" defer></script>
<script src="admin.js" defer></script>
<script type="module" src="sky.js"></script>
</body>
</html>
